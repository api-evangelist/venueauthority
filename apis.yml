aid: venueauthority
name: Venue Authority
description: >-
  Venue Authority is a self-serve facility verification and monitoring API for payment facilitators,
  marketplaces, KYB providers and restaurant platforms working with food-service businesses. It matches
  a business name and street address to a supported regulator facility record, returns source-linked
  evidence for that match, and supports ongoing portfolio monitoring so a change at the regulator
  surfaces after onboarding rather than at the next manual review. The public contract is an OpenAPI
  3.1 document of 12 paths and 15 operations covering resolve, facility lookup, coverage, portfolios
  and portfolio items, authenticated with a bearer API key. Coverage is enumerated by the API itself
  rather than described in prose, and the provider publishes an APIs.json, llms.txt, llms-full.txt,
  a Postman collection and a machine-readable error catalogue alongside the contract.
