x-provenance:
  added: '2026-08-21'
  method: searched
  source: https://github.com/api-search/inbox/issues/12
  note: >-
    Submitted by the provider on the api-search/inbox issue tracker with a complete artifact list.
    Every declared URL was fetched and confirmed 2xx before being recorded here, against a control
    probe of two invented paths that returned real 404s, so the 200s are genuine routes and not a
    catch-all. The live API was exercised anonymously: /api/v1/coverage returned real regulator
    records, /api/v1/resolve returned 405 (it is POST-only) and /api/v1/facilities/{id} returned 401.
    Nothing in this record is derived or modelled.
x-evidence:
  amended: '2026-08-21'
  source: https://github.com/api-search/inbox/issues/12
  note: >-
    The provider reported two changes on the original issue and both were re-verified live before
    anything here moved. FIRST, the contract is now tagged: the published OpenAPI declares five tags
    and all fifteen operations carry one, where the version harvested on 2026-08-21 declared none.
    Diffed against the archived original, the operation set is byte-identical — same 12 paths, same
    15 operationIds, nothing added, removed or renamed — so the change is purely additive and the
    single document was re-split into five per-resource documents with 1.00x duplication and zero
    dangling references. The pre-tag upstream is kept at
    openapi/_original/venueauthority-openapi-2026-08-21-untagged.json.
    SECOND, the client packages exist: packages/node-sdk, packages/python-sdk and packages/mcp-server
    are present in the repository, each carrying its own MIT LICENSE, and release clients-v0.1.0
    publishes four build artifacts whose SHA-256 digests are computed by GitHub rather than supplied
    by the provider. The MCP package's declared dependencies resolve on npm at the pinned versions.
    npm and PyPI return 404 for these package names, which matches the provider's own statement that
    no registry-availability claim is being made; no registry pointer is recorded here.
    Every URL added to common[] was fetched against a control probe of four plausible-but-absent
    paths (/openapi.yaml, /sdk, /docs/changelog.json, /.well-known/security.txt) that all returned
    real 404s, so the 200s are genuine routes.
  not_recorded:
    - >-
      The provider's apis.json declares maintainers[0].organizationName "Zupa Print", which does not
      match any other Venue Authority surface. Left out of maintainers here pending confirmation from
      the provider rather than recorded as the operating entity.
    - >-
      https://venueauthority.com/.well-known/apis.json returns 404. The apis.json copy held under
      well-known/ in this repo is a harvest of https://venueauthority.com/apis.json, not evidence of
      a .well-known catalog, and is not scored as one.
