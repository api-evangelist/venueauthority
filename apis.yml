aid: venueauthority
name: Venue Authority
description: >-
  Venue Authority is a self-serve facility verification and monitoring API for payment facilitators,
  marketplaces, KYB providers and restaurant platforms working with food-service businesses. It matches
  a business name and street address to a supported regulator facility record, returns source-linked
  evidence for that match, and supports ongoing portfolio monitoring so a change at the regulator
  surfaces after onboarding rather than at the next manual review. The public contract is an OpenAPI
  3.1 document of 12 paths and 15 operations, authenticated with a bearer API key, and the provider
  tags every operation into five groups — resolution and evidence, coverage, watchlists, webhooks and
  audit exports — which is how it is carried here as five per-resource documents. Coverage is
  enumerated by the API itself rather than described in prose, and the provider publishes an
  APIs.json, llms.txt, llms-full.txt, a Postman collection and a machine-readable error catalogue
  alongside the contract, plus MIT-licensed Node.js, Python and MCP client packages released on
  GitHub with checksummed build artifacts.
